name: Agtoosa Performance Benchmark CI

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  performance-benchmark:
    name: Continuous Performance Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Agtoosa
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build Knowledge Graph
        run: |
          agtoosa graph build

      - name: Run Continuous Performance Benchmark CI
        run: |
          agtoosa ci benchmark \
            --base origin/${{ github.base_ref || 'main' }} \
            --threshold 10.0 \
            --strict \
            --output pr-benchmark.md

      - name: Post PR Benchmark Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr-benchmark.md')) {
              const body = fs.readFileSync('pr-benchmark.md', 'utf8');
              const marker = '<!-- agtoosa-benchmark-comment -->';
              const commentBody = `${marker}\n${body}`;

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existing = comments.find(c => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: commentBody
                });
              }
            }
